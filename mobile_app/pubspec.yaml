name: wealth_triangle
description: An investment simulation app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  firebase_core: ^3.0.0                    # for database
  firebase_auth: ^5.0.0                    # for database
  cloud_firestore: ^5.0.0                  # for database
  firebase_crashlytics: ^4.1.3             # crash reporting
  intl: ^0.20.2
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.0.4                      # for camera input
  google_mlkit_text_recognition: ^0.11.0
  google_fonts: ^6.1.0                      # for game
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  flutter_dotenv: ^6.0.1
  google_sign_in: ^6.2.1
  candlesticks: ^3.0.1
  pdf: ^3.11.1
  flutter_overlay_window:                    # floating assistant bubble (Android only)
    path: packages/flutter_overlay_window     # vendored + patched, see packages/flutter_overlay_window/PATCH.md
  speech_to_text: ^7.4.0                     # voice input for floating assistant
  permission_handler: ^11.3.1                # mic/camera permission requests
uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo_icon_adaptive_fg.png"
  web:
    generate: true
    image_path: "assets/icon/logo_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1B3A6B"

flutter:
  uses-material-design: true
  assets:
    - lib/.env
    - assets/icon/logo_icon.png