name: wealth_triangle
description: An investment simulation app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  firebase_core: ^3.0.0                    # for database
  firebase_auth: ^5.0.0                    # for database
  cloud_firestore: ^5.0.0                  # for database
  intl: ^0.20.2
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.0.4                      # for camera input
  google_mlkit_text_recognition: ^0.11.0
  google_fonts: ^6.1.0                      # for game
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  flutter_dotenv: ^6.0.1
  google_sign_in: ^6.2.1
uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/.env